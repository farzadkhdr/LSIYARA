<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بانگێشتنامەی هاوسەگیرانی فەرزاد و رەیان</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Screen 1: The Gate & Animation */
        #gate-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            transition: opacity 1.5s ease;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        /* Container for zooming effect */
        .zoom-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(1);
            transition: transform 4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .zoom-container.zoomed {
            transform: scale(2.5);
        }

        /* Gate Image / Structure */
        .gates-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gate-bg-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Opening Doors Animation */
        .door {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            background: linear-gradient(135deg, #d4af37, #aa7c11, #d4af37);
            border: 5px solid #fff;
            transition: transform 2.5s ease-in-out;
            z-index: 3;
        }

        .door.left {
            left: 0;
            transform-origin: left;
        }

        .door.right {
            right: 0;
            transform-origin: right;
        }

        .zoom-container.open .door.left {
            transform: perspective(1200px) rotateY(-110deg);
        }

        .zoom-container.open .door.right {
            transform: perspective(1200px) rotateY(110deg);
        }

        /* White Light Flash */
        #flash-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        #flash-light.active {
            opacity: 1;
        }

        /* Screen 2: Invitation Content */
        #invitation-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fffdf9;
            overflow-y: auto;
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 5;
            padding: 20px;
            text-align: center;
            color: #333;
        }

        .invitation-card {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
            border: 2px solid #d4af37;
        }

        .names {
            font-size: 28px;
            color: #b8860b;
            margin: 20px 0;
            font-weight: bold;
        }

        .quran-verse {
            font-size: 16px;
            color: #555;
            margin: 20px 0;
            line-height: 1.8;
            font-style: italic;
        }

        .details {
            margin: 20px 0;
            font-size: 15px;
            line-height: 1.6;
        }

        /* Click to Open Prompt */
        .start-prompt {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(212, 175, 55, 0.9);
            color: #fff;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            z-index: 15;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }
    </style>
</head>
<body>

    <div id="gate-screen">
        <div class="overlay"></div>
        <div class="zoom-container" id="zoomContainer">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1000&auto=format&fit=crop" class="gate-bg-image" alt="Wedding Hall">
            
            <div class="door left"></div>
            <div class="door right"></div>
        </div>

        <div class="start-prompt" id="startBtn">بۆ کردنەوە کلیک بکە</div>
    </div>

    <div id="flash-light"></div>

    <div id="invitation-screen">
        <div class="invitation-card">
            <h2 style="color: #d4af37;">بانگێشتنامە</h2>
            <div class="names">فەرزاد & رەیان</div>
            
            <p class="quran-verse">
                «وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّن أنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّدَّةً وَرَحْمَةً»
            </p>

            <div class="details">
                <p>بە خۆشحاڵییەوە بانگێشتتان دەکەین بۆ ئاهەنگی هاوسەرگیرمان</p>
                <br>
                <p><strong>رۆژ:</strong> پێنجشەممە</p>
                <p><strong>بەڕێوەچوون:</strong> هۆڵی شاهانە - هەولێر</p>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const zoomContainer = document.getElementById('zoomContainer');
        const flashLight = document.getElementById('flash-light');
        const gateScreen = document.getElementById('gate-screen');
        const invitationScreen = document.getElementById('invitation-screen');

        startBtn.addEventListener('click', () => {
            // شاردنەوەی دوگمەکە
            startBtn.style.display = 'none';

            // ١. چوونە پێشەوەی هێواش (Zoom in) بەرەو دەرگا
            zoomContainer.classList.add('zoomed');

            // ٢. کردنەوەی دەرگاکە دوای ٣ چرکە
            setTimeout(() => {
                zoomContainer.classList.add('open');
            }, 2500);

            // ٣. دەرکەوتنی ڕوومای سپی (Flash light) بۆ گواستنەوە بۆ ناو بانگێشتنامە
            setTimeout(() => {
                flashLight.classList.add('active');
            }, 4500);

            // ٤. نیشاندانی بانگێشتنامەی فەرزاد و رەیان
            setTimeout(() => {
                gateScreen.style.display = 'none';
                flashLight.classList.remove('active');
                invitationScreen.style.display = 'block';
                invitationScreen.style.opacity = '1';
            }, 5500);
        });
    </script>
</body>
</html>
